name: Preview Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the preview package without publishing a release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: preview-main
  cancel-in-progress: true

jobs:
  preview:
    name: Build Preview Package
    runs-on: [self-hosted, linux, x64, rf4-build]
    timeout-minutes: 45
    env:
      HTTP_PROXY: ${{ secrets.ACTIONS_PROXY_URL }}
      HTTPS_PROXY: ${{ secrets.ACTIONS_PROXY_URL }}
      NO_PROXY: localhost,127.0.0.1,::1
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Build preview package
        id: package
        run: bash .github/scripts/build-preview.sh "$GITHUB_SHA"

      - name: Upload dry-run artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.release_notes }}
          if-no-files-found: error

      - name: Publish preview release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: RF4 Server Simulator ${{ steps.package.outputs.version }}
          body_path: ${{ steps.package.outputs.release_notes }}
          files: ${{ steps.package.outputs.asset_path }}
          prerelease: true

      - name: Keep latest three preview releases
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = 3;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const previews = releases
              .filter((release) => /^preview-[0-9a-f]{7}$/i.test(release.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${previews.length} preview releases; keeping ${keep}.`);
            for (const release of previews.slice(keep)) {
              core.info(`Deleting old preview ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            }
