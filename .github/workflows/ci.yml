name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Vet
    runs-on: [self-hosted, linux, x64, rf4-build]
    timeout-minutes: 30
    env:
      HTTP_PROXY: ${{ secrets.ACTIONS_PROXY_URL }}
      HTTPS_PROXY: ${{ secrets.ACTIONS_PROXY_URL }}
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
